# 무한매수법 V4.0 봇: 프로젝트 루트(.)를 /app 에 마운트.
# .env(비밀값), storage/(설정·상태·기록·로그)는 호스트 폴더에 남아 있어 컨테이너를 다시 만들어도 유지됩니다.
services:
  telegram-bot:
    build: .
    container_name: my_telegram_bot
    volumes:
      - ./:/app
    working_dir: /app
    environment:
      - PYTHONUNBUFFERED=1
    command: python main.py
    restart: unless-stopped
    logging:  # NAS 디스크를 로그가 채우지 않도록 제한
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
