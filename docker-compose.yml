version: '3.8'

services:
  ubs_bot:
    build: .
    container_name: ubs_manager_bot
    restart: always
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
